# ============================================================
#  UNIVERSAL YANDEX STATION TELEGRAM CONTROL BOT CONFIGURATION
#  Поддержка: Станция Мини 1/2/3/Про, Лайт 1/2, Миди, Станция 2, Макс
# ============================================================

[Station]
# IP-адрес вашей Яндекс Станции в локальной Wi-Fi сети
ip = 192.168.0.100
# Порт ADB (по умолчанию 5555)
port = 5555

# Опционально: Официальный API-ключ Yandex SpeechKit для озвучки точным голосом Татьяны Шитовой (voice=alisa).
# Если ключа нет, бот автоматически использует бесплатный высококачественный нейросетевой голос Алисы.
# yandex_speechkit_key = YOUR_YANDEX_SPEECHKIT_KEY
# yandex_speechkit_folder_id = YOUR_FOLDER_ID

[TelegramBot]
# Токен бота, полученный у @BotFather в Telegram
token = YOUR_BOT_TOKEN

# Ваш цифровой Telegram ID (узнать в боте @userinfobot)
# Бот будет принимать команды ТОЛЬКО от этого пользователя!
admin_id = 0

# Стандартные ключи Telethon (можно оставить как есть)
api_id = 0
api_hash = YOUR_API_HASH

# Опционально: Настройки прокси для обхода блокировок или TimeoutError к серверам Telegram
# [Proxy]
# enabled = false
# proxy_type = socks5   # socks5 или http
# addr = 127.0.0.1
# port = 10808
# username = 
# password = 
