[bot]
owner_id = 123456789 # Replace with YOUR Telegram numeric ID
token_env = "TELEGRAM_BOT_TOKEN"
state_dir = "state"
rate_seconds = 1.0
audit_days = 30
# Optional: an existing Telegram egress proxy, kept outside the repository.
# telegram_proxy_env = "TELEGRAM_PROXY_URL"
# Optional read-only access to your old per-station action journals.
# legacy_history_dir = "/opt/previous-bot"

# Use your existing SSH tunnels. These example ports DO NOT create a connection.
[[stations]]
id = "living_room"
label = "Гостиная"
url = "http://127.0.0.1:18200/api"
expected_model = "yandexstation_2"
allow_packages = false

[[stations]]
id = "desk"
label = "Рабочий стол"
url = "http://127.0.0.1:18146/api"
expected_model = "yandexmini_3_pro"
allow_packages = false
