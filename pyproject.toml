[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-control-luna"
version = "3.0.0b3"
description = "Capability-driven Telegram control for LUNA stations"
requires-python = ">=3.10"
dependencies = ["aiogram>=3.22,<4", "httpx>=0.28,<0.29", "aiosqlite>=0.21,<1", "aiohttp-socks>=0.10,<1", "tomli>=2,<3; python_version < '3.11'", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
stationbot = "stationbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
